<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101a35" />
    <meta name="color-scheme" content="dark" />

    <title>North Point Advisory | Coming Soon</title>
    <meta
      name="description"
      content="North Point Advisory is launching on 22 September 2026. Clear direction. Considered advice."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://northpointadvisory.co.za/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="North Point Advisory" />
    <meta property="og:title" content="North Point Advisory | Coming Soon" />
    <meta
      property="og:description"
      content="Clear direction. Considered advice. Launching 22 September 2026."
    />
    <meta property="og:url" content="https://northpointadvisory.co.za/" />
    <meta property="og:image" content="https://northpointadvisory.co.za/northpoint-advisory-logo.png" />
    <meta property="og:image:width" content="2073" />
    <meta property="og:image:height" content="894" />
    <meta property="og:image:alt" content="North Point Advisory logo" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="North Point Advisory | Coming Soon" />
    <meta
      name="twitter:description"
      content="Clear direction. Considered advice. Launching 22 September 2026."
    />
    <meta name="twitter:image" content="https://northpointadvisory.co.za/northpoint-advisory-logo.png" />
    <meta name="twitter:image:alt" content="North Point Advisory logo" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "North Point Advisory",
        "url": "https://northpointadvisory.co.za/",
        "logo": "https://northpointadvisory.co.za/northpoint-advisory-logo.png"
      }
    </script>
  </head>
  <body>
    <main class="site-shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="North Point Advisory home">
          <img src="/northpoint-advisory-logo.png" alt="North Point Advisory" />
        </a>
        <div class="launch-status" aria-label="Site status">
          <span class="status-dot" aria-hidden="true"></span>
          Launching soon
        </div>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">A new direction is taking shape</p>
          <h1 id="hero-title">Clarity for what<br />comes next.</h1>
          <p class="intro">
            North Point Advisory launches on 22 September 2026.
          </p>
        </div>

        <div class="countdown-wrap">
          <div class="countdown-heading">
            <span>Time to launch</span>
            <span class="launch-date">22.09.26</span>
          </div>

          <div class="countdown" aria-label="Countdown to launch" aria-live="polite">
            <div class="time-block">
              <strong id="days">00</strong>
              <span>Days</span>
            </div>
            <div class="divider" aria-hidden="true"></div>
            <div class="time-block">
              <strong id="hours">00</strong>
              <span>Hours</span>
            </div>
            <div class="divider" aria-hidden="true"></div>
            <div class="time-block">
              <strong id="minutes">00</strong>
              <span>Minutes</span>
            </div>
            <div class="divider" aria-hidden="true"></div>
            <div class="time-block">
              <strong id="seconds">00</strong>
              <span>Seconds</span>
            </div>
          </div>
          <p id="countdown-note" class="countdown-note">South Africa Standard Time</p>
        </div>
      </section>

      <footer class="site-footer">
        <p>North Point Advisory</p>
        <p>Johannesburg · South Africa</p>
        <p>© <span id="year"></span></p>
      </footer>

      <div class="north-marker" aria-hidden="true">
        <span>N</span>
        <svg viewBox="0 0 64 84" role="presentation">
          <path d="M32 0 64 70 32 52 0 70 32 0Z" fill="currentColor" />
          <path d="M32 19 32 52 14 62 32 19Z" fill="rgba(16,26,53,.28)" />
        </svg>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
